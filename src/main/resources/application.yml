# ============================================================
# Lion LangChain4j Agent - 非敏感配置
# 敏感信息(数据库密码 / API 密钥等)统一放在项目根目录 .env 文件中,
# 应用启动时由 EnvFileLoader 加载为系统属性, 此处仅使用 ${...} 占位引用。
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # force=true: 即使请求/响应未声明编码也强制按 UTF-8 处理, 避免中文乱码
      force: true

spring:
  application:
    name: lion-langchain4j-agent
  # 文件上传限制(RAG 知识库文档上传, 默认 1MB 太小)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lion_agent_4j}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  # token 请求头名称(前端 axios 拦截器会携带同名请求头)
  token-name: sa-token
  # token 有效期(秒): 7 天
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

langchain4j:
  open-ai:
    chat-model:
      # 千问(DashScope)走 OpenAI 兼容协议; api-key 属于敏感信息, 来自 .env
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${QWEN_MODEL_NAME:qwen-plus}
      temperature: 0.7
      max-tokens: 2048
      log-requests: true
      log-responses: true
    # 流式对话模型: 独立自动装配(openAiStreamingChatModel), 不配则 AgentAssistant.chatStream 报 streamingChatModel cannot be null
    streaming-chat-model:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${QWEN_MODEL_NAME:qwen-plus}
      temperature: 0.7
      max-tokens: 2048
      log-requests: true
      log-responses: true
    # 向量化模型(Embedding): RAG 知识库使用, DashScope OpenAI 兼容 /embeddings 接口,
    # 复用 QWEN_API_KEY; 不配置则缺少 openAiEmbeddingModel Bean, RagService 注入时报错
    embedding-model:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
      # DashScope 百炼账号需开通 text-embedding-v3 服务; 维度默认 1024, 不额外指定
      log-requests: true
      log-responses: true

  # Milvus 向量库(由 langchain4j-milvus-spring-boot-starter 自动装配, 前缀固定 langchain4j.milvus)
  milvus:
    enabled: true
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
    # 集合名(相当于 Redis 版的索引名), 换集合改这里
    collection-name: lion_langchain4j_docs
    # 必须与向量化模型输出维度一致: text-embedding-v3 默认 1024
    dimension: 1024
    # FLAT: 精确检索, 数据量小时足够; 数据量大可改 HNSW 提升检索速度
    index-type: FLAT
    metric-type: COSINE
    # STRONG: 强一致, 刚写入(即使还没 flush)的片段也能立刻被检索到
    consistency-level: STRONG
    # 必须为 false, 否则上传大文档必报错:
    # Milvus 服务端默认 quotaAndLimits.flushRate.collection=0.1, 即 10 秒内只放行 1 次 flush;
    # 而 LangChain4j 的 addAll 在 autoFlushOnInsert=true 时会每批都调 flush, 本地入库按
    # EMBEDDING_BATCH_SIZE=10 分批, 一篇文档就会 flush 多次 → 抛
    # ServerException: request is rejected by grpc RateLimiter middleware ... [rate=0.1]
    # 关闭后数据写入 WAL/growing segment(STRONG 一致下立即可检索), 落盘时机交给 Milvus 自己控制
    auto-flush-on-insert: false
    # 检索时不回传向量本身, 减少网络开销(只需 text/metadata)
    retrieve-embeddings-on-search: false
    database-name: ${MILVUS_DATABASE:default}
    # 未启用鉴权时不要配置 username/password(空串会被当作凭据传给 Milvus 导致认证失败)


# 知识库(RAG)上传文件保存目录: 相对运行目录, 不存在会自动创建(已被 .gitignore 忽略)
rag:
  upload-dir: upload


# Actuator 监控端点
# 不配 exposure 时 Spring Boot 只暴露 health, 访问 /actuator/circuitbreakers 会因为
# "找不到对应 handler" 被 Spring MVC 当作静态资源处理, 抛 NoResourceFoundException(看起来像 404)
management:
  endpoints:
    web:
      exposure:
        # circuitbreakers: 熔断器当前状态(CLOSED/OPEN/HALF_OPEN + 失败率)
        # circuitbreakerevents: 熔断器事件流(成功/失败/状态转换)
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always


# 在线接口文档(springdoc OpenAPI / Swagger UI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none

logging:
  level:
    com.lion.agent: info
    # langchain4j 1.x 已移除 openai4j(dev.ai4j.openai4j), 模型请求/响应日志由 langchain4j OpenAI
    # 模块通过 log-requests/log-responses 配置控制; 需要排查时可将 dev.langchain4j 临时调为 debug
    dev.ai4j.openai4j: debug


resilience4j:
  circuitbreaker:
    # 熔断器状态机：CLOSED（关闭，正常放行）→ OPEN（打开，直接拒绝并走 fallback）→ HALF_OPEN（半开，试探放行）
    instances:
      # 实例名需与 WeatherApiClient 上 @CircuitBreaker(name = "weatherApi") 一致
      weatherApi:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 2                # 外部接口流量小，2 次失败即可开始评估（便于快速熔断）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 白名单：只有这些异常计入失败率(不配则默认所有异常都计入)
          - com.lion.agent.common.exception.BusinessException
        # ignore-exceptions:                      # 可选：这些异常不算失败，如
        #   - java.lang.IllegalArgumentException

# 天气工具演示配置(仅学习演示用)：0=不注入故障，1=每次调用必失败，便于观察熔断与降级
weather:
  mock-failure-rate: 1